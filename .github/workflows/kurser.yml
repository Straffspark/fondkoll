name: Hämta kurser

on:
  schedule:
    - cron: '30 17 * * *'   # varje dag efter börsens stängning (UTC)
    - cron: '15 6 * * *'    # varje morgon, för fondkurser som publiceras sent
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kurser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-prices.mjs
      - name: Spara kurser
        run: |
          git config user.name "fondkoll-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Uppdatera kurser"
          git push
